<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Shoes Web Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="assets/icon-nike.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- HEADER SECTION -->
        <header>
            <div class="logo">
                <img src="assets/logo.png" alt="">
            </div>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#" class="active">Products</a>
                <a href="#">Contact</a>
            </nav>
            <a href="#" class="btn-action">Place order <img src="assets/placeOrder.svg" alt=""></a>
        </header>

        <!-- HERO SECTION -->
        <main class="hero">
            <!-- Top Pills Toggle Tabs -->
            <div class="toggle-tabs">
                <button class="tab-btn active">Products</button>
                <button class="tab-btn">Custom</button>
            </div>

            <!-- Hero Main Grid Wrapper -->
            <div class="hero-content">
                
                <!-- Left Column: Typography -->
                <div class="left-col">
                    <h1>FIND YOUR <br> GREATNESS</h1>
                    <p>Built for speed and confidence, <br> every pair combines premium <br> materials and bold design. <br> Engineered for comfort, made for <br> movement.</p>
                </div>

                <!-- Center Column: HYPE Text & Floating Shoe -->
                <div class="center-col">
                    <div class="bg-text">HY</div>
                    <img src="assets/shoe.png" alt="Orange Air Jordan Sneaker" class="shoe-img">
                    <div class="bg-text2">PE</div>
                </div>

                <!-- Right Column: Interactive Selectors -->
                <div class="right-col">
                    <div class="color-selector">
                        <h3>Choose Your Color</h3>
                        <div class="colors">
                            <span class="circle cyan"></span>
                            <span class="circle orange active"></span>
                            <span class="circle pink"></span>
                        </div>
                    </div>

                    <div class="size-selector">
                        <div class="sizes">
                            <span class="size">40</span>
                            <span class="size active">42</span>
                            <span class="size">44</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- FOOTER SECTION -->
        <footer>
            <div class="social-icons">
                <a href="#"><img src="assets/instagram.svg" alt="Instagram"></a>
                <a href="#"><img src="assets/facebook.svg" alt="Facebook"></a>
                <a href="#"><img src="assets/pinterest.svg" alt="Pinterest"></a>
                <a href="#"><img src="assets/youtube.svg" alt="YouTube"></a>
            </div>
            
            <div class="footer-center">
                <span>SNEAKERS FOR MORE</span>
            </div>

            <a href="#" class="btn-action footer-btn">See all products <span class="arrow">↗</span></a>
        </footer>
    </div>

</body>
</html>
